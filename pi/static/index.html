<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Claude Notify</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="state-idle">
  <div class="stage">
    <div class="shadow"></div>
    <div class="character" id="character">
      <svg viewBox="-150 -150 300 300" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <radialGradient id="bodyGrad" cx="40%" cy="35%" r="70%">
            <stop offset="0%" stop-color="#F6CDA8"/>
            <stop offset="70%" stop-color="#E89B6B"/>
            <stop offset="100%" stop-color="#C2693A"/>
          </radialGradient>
          <radialGradient id="rayGrad" cx="50%" cy="20%" r="80%">
            <stop offset="0%" stop-color="#F4B486"/>
            <stop offset="100%" stop-color="#D17A45"/>
          </radialGradient>
        </defs>

        <g class="rays">
          <g class="ray ray-main"><ellipse cx="0" cy="-95" rx="22" ry="58" fill="url(#rayGrad)"/></g>
          <g class="ray ray-main" style="transform:rotate(90deg)"><ellipse cx="0" cy="-95" rx="22" ry="58" fill="url(#rayGrad)"/></g>
          <g class="ray ray-main" style="transform:rotate(180deg)"><ellipse cx="0" cy="-95" rx="22" ry="58" fill="url(#rayGrad)"/></g>
          <g class="ray ray-main" style="transform:rotate(270deg)"><ellipse cx="0" cy="-95" rx="22" ry="58" fill="url(#rayGrad)"/></g>
          <g class="ray ray-diag" style="transform:rotate(45deg)"><ellipse cx="0" cy="-80" rx="16" ry="44" fill="url(#rayGrad)"/></g>
          <g class="ray ray-diag" style="transform:rotate(135deg)"><ellipse cx="0" cy="-80" rx="16" ry="44" fill="url(#rayGrad)"/></g>
          <g class="ray ray-diag" style="transform:rotate(225deg)"><ellipse cx="0" cy="-80" rx="16" ry="44" fill="url(#rayGrad)"/></g>
          <g class="ray ray-diag" style="transform:rotate(315deg)"><ellipse cx="0" cy="-80" rx="16" ry="44" fill="url(#rayGrad)"/></g>
        </g>

        <g class="body-group">
          <circle class="body" cx="0" cy="0" r="58" fill="url(#bodyGrad)"/>
          <ellipse class="cheek cheek-l" cx="-28" cy="14" rx="10" ry="6" fill="#E07A4A" opacity="0.55"/>
          <ellipse class="cheek cheek-r" cx="28" cy="14" rx="10" ry="6" fill="#E07A4A" opacity="0.55"/>

          <g class="face">
            <g class="eyes">
              <g class="eye eye-l">
                <ellipse class="eyeball" cx="-20" cy="-8" rx="8" ry="11" fill="#2B1810"/>
                <circle class="shine" cx="-17" cy="-12" r="2.5" fill="#FFF"/>
              </g>
              <g class="eye eye-r">
                <ellipse class="eyeball" cx="20" cy="-8" rx="8" ry="11" fill="#2B1810"/>
                <circle class="shine" cx="23" cy="-12" r="2.5" fill="#FFF"/>
              </g>
            </g>
            <path class="mouth" d="M -12 18 Q 0 24 12 18" fill="none" stroke="#2B1810" stroke-width="4" stroke-linecap="round"/>
          </g>
        </g>
      </svg>

      <div class="zzz" id="zzz">
        <span>z</span><span>z</span><span>Z</span>
      </div>
    </div>

    <div class="session" id="session"></div>
    <div class="status" id="status">bored…</div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
